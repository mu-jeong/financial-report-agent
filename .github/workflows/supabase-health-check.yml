name: Supabase health check

on:
  schedule:
    # GitHub schedules use UTC. Run away from the top of the hour to reduce delay.
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTHCHECK_TOKEN: ${{ secrets.SUPABASE_HEALTHCHECK_TOKEN }}
    steps:
      - name: Call the read-only database health check
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HEALTHCHECK_TOKEN}" ]]; then
            echo "Required Supabase health-check secret is missing." >&2
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --proto '=https' \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --retry-max-time 90 \
            --retry-all-errors \
            --request GET \
            --header "x-healthcheck-token: ${HEALTHCHECK_TOKEN}" \
            --output /dev/null \
            "https://rjjnhvoontxpimhiabou.supabase.co/functions/v1/supabase-health-check"

          echo "Supabase database health check succeeded."
